<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Soft Pink Sakura Gradient -->
    <linearGradient id="sakuraFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA6B9" />
      <stop offset="100%" stop-color="#FFD1DC" />
    </linearGradient>
    
    <!-- Single Petal Definition with Cleft -->
    <g id="petal">
      <path d="M 0,0 C 15,-15 20,-35 10,-45 C 5,-50 0,-42 0,-42 C 0,-42 -5,-50 -10,-45 C -20,-35 -15,-15 0,0 Z" fill="url(#sakuraFill)" />
    </g>
  </defs>
  
  <!-- Flower Group Centered -->
  <g transform="translate(50, 50)">
    <use href="#petal" />
    <use href="#petal" transform="rotate(72)" />
    <use href="#petal" transform="rotate(144)" />
    <use href="#petal" transform="rotate(216)" />
    <use href="#petal" transform="rotate(288)" />
    
    <!-- Center Pistil Base -->
    <circle cx="0" cy="0" r="6" fill="#FF5C77" opacity="0.85" />
    
    <!-- Radiating Stamens -->
    <path d="M 0,0 L 0,-13 M 0,0 L 12,-4 M 0,0 L 7.5,10 M 0,0 L -7.5,10 M 0,0 L -12,-4" stroke="#FF5C77" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Stamen Tips (Anthers) -->
    <circle cx="0" cy="-13" r="1.5" fill="#FF5C77" />
    <circle cx="12" cy="-4" r="1.5" fill="#FF5C77" />
    <circle cx="7.5" cy="10" r="1.5" fill="#FF5C77" />
    <circle cx="-7.5" cy="10" r="1.5" fill="#FF5C77" />
    <circle cx="-12" cy="-4" r="1.5" fill="#FF5C77" />
  </g>
</svg>